<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say No(o) Compass</title>
    <link rel="stylesheet" href="./css/stylesheet.css">
    <link rel="icon" type="image/png" sizes="16x16" href="./Images/favicon-16x16.png">

</head>

<body>
    <header>
        <h1><img src="./Images/logo NoCompass.png" alt="Say No(o) Compass" height="150px" width="150px">
            Say No(o) Compass</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="consequences">

            <h2>Consequences Questions</h2>

            <form id="consequences-form">

                <h3>
                    What do you think will happen if you say yes?
                </h3>

                <div class="radio-option">
                    <input type="radio" id="satisfied" name="yes-consequence" value="satisfied">
                    <label for="satisfied">I will feel satisfied that I helped someone</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="lose-time" name="yes-consequence" value="lose-time">
                    <label for="lose-time">I will lose personal time</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="stressed-overwhelmed" name="yes-consequence" value="stressed-overwhelmed">
                    <label for="stressed-overwhelmed">I will feel stressed or overwhelmed.</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="nothing-will-change" name="yes-consequence" value="nothing-will-change">
                    <label for="nothing-will-change">Nothing significant will change.</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="other-yes" name="yes-consequence" value="other-yes">
                    <label for="other-yes">Other</label>
                </div>

                <hr>

                <h3>
                    What do you think will happen if you say no?
                </h3>

                <label class="radio-option">
                    <input type="radio" id="feel-guilty" name="no-consequence" value="feel-guilty">
                    <span>I will feel guilty</span>
                </label>

                <div class="radio-option">
                    <input type="radio" id="someone-disappointed" name="no-consequence" value="someone-disappointed">
                    <label for="someone-disappointed">Someone may be disappointed</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="boundaries" name="no-consequence" value="boundaries">
                    <label for="boundaries">I will protect my own boundaries.</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="nothing-significant" name="no-consequence" value="nothing-significant">
                    <label for="nothing-significant">Nothing significant will happen</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="other-no" name="no-consequence" value="other-no">
                    <label for="other-no">Other</label>
                </div>

                <button type="submit" class="btn">
                    Continue
                </button>
            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Say No(o) Compass. All rights reserved.</p>
    </footer>
    <script src="./script/consequences.js"></script>
</body>

</html>
