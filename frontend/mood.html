<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/stylesheet.css">

    <link rel="icon" type="image/png" sizes="16x16" href="./Images/favicon-16x16.png">

</head>

<body>
    <header>
        <h1><img src="./Images/logo NoCompass.png" alt="Say No(o) Compass" height="150px" width="150px">
            Say No(o) Compass</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="mood">

            <h2>How do you feel today?</h2>

            <p>
                Take a moment to reflect on how you are feeling right now.
            </p>

            <form id="mood-form">

                <!-- Multiple Choice-->
                <div class="radio-option">
                    <input type="radio" id="very-bad" name="mood" value="very-bad">
                    <label for="very-bad">😞 Very bad</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="neutral" name="mood" value="neutral">
                    <label for="neutral">😐 Neutral</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="very-good" name="mood" value="very-good">
                    <label for="very-good">😄 Very good</label>
                </div>

                <!-- free answer -->
                <label for="mood-description">
                    Would you like to share something?
                </label>

                <textarea id="mood-description" rows="5"></textarea>

                <button type="submit" class="btn">
                    Continue
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Say No(o) Compass. All rights reserved.</p>
    </footer>
    <script src="./script/mood.js"></script>
</body>

</html>
