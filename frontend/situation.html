<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/stylesheet.css">
<title>Say No(o) Compass</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./Images/favicon-16x16.png">

</head>

<body>
    <header>
        <h1><img src="./Images/logo NoCompass.png" alt="Say No(o) Compass" height="150px" width="150px">
            Say No(o) Compass</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="situation">

            <h2>What is the situation?</h2>

            <p>
                Describe the situation.
            </p>

            <form id="situation-form">

                <label for="situation-description">
                    What happened?
                </label>
                <textarea id="situation" name="situation-description" rows="6" placeholder="Describe the situation...">
</textarea>

                <hr>
                <h3> <label for="who-is-asking">
                        Who is asking you?</label>
                </h3>
                <div class="radio-option">
                    <input type="radio" id="partner" name="who-is-asking" value="partner">
                    <label for="partner">My partner</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="family" name="who-is-asking" value="family">
                    <label for="family">A family member</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="friend" name="who-is-asking" value="friend">
                    <label for="friend">A friend</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="colleague" name="who-is-asking" value="colleague">
                    <label for="colleague">A colleague</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="manager" name="who-is-asking" value="manager">
                    <label for="manager">My manager / teacher</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="someone-else" name="who-is-asking" value="someone-else">
                    <label for="someone-else">Someone else</label>
                </div>

                <hr>

                <h3><label for="request-importance">
                        How important is this request?</label></h3>

                <div class="radio-option">
                    <input type="radio" id="very-important" name="request-importance" value="very-important">
                    <label for="very-important">Very important</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="important" name="request-importance" value="important">
                    <label for="important">Important</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="neutral" name="request-importance" value="neutral">
                    <label for="neutral">Neutral</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="not-very-important" name="request-importance" value="not-very-important">
                    <label for="not-very-important">Not very important</label>
                </div>

                <div class="radio-option">
                    <input type="radio" id="not-important-at-all" name="request-importance"
                        value="not-important-at-all">
                    <label for="not-important-at-all">Not important at all</label>
                </div>

                <button type="submit" class="btn">Continue</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Say No(o) Compass. All rights reserved.</p>
    </footer>
    <script src="./script/situation.js"></script>
</body>

</html>
