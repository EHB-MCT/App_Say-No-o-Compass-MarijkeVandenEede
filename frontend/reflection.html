<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say No(o) Compass</title>
    <link rel="stylesheet" href="./css/stylesheet.css">
    <link rel="icon" type="image/png" sizes="16x16" href="./Images/favicon-16x16.png">

</head>

<body>
    <header>
        <h1><img src="./Images/logo NoCompass.png" alt="Say No(o) Compass" height="150px" width="150px">
            Say No(o) Compass</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="reflection">

            <h2>Reflection Questions</h2>

            <form>

                <label for="reflection">
                    Why do you want to say yes?</label>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="disappoint" name="why-yes" value="disappoint">
                        <label for="disappoint">I don't want to disappoint someone</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="guilty" name="why-yes" value="guilty">
                        <label for="guilty">I feel guilty</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="pressured" name="why-yes" value="pressured">
                        <label for="pressured">I feel pressured</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="help" name="why-yes" value="help">
                        <label for="help">I really want to help</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="other" name="why-yes" value="other">
                        <label for="other">Other</label>
                    </div>
                </div>

                <hr>

                <label for="reflection">
                    Why do you want to say no?</label>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="myself" name="why-no" value="myself">
                        <label for="myself">I need time for myself</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="commitments" name="why-no" value="commitments">
                        <label for="commitments">I already have other commitments</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="tired" name="why-no" value="tired">
                        <label for="tired">I feel too tired</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="against-my-own-needs" name="why-no" value="against-my-own-needs">
                        <label for="against-my-own-needs">It goes against my own needs</label>
                    </div>
                </div>

                <div class="radio-option">
                    <div>
                        <input type="radio" id="other" name="why-no" value="other">
                        <label for="other">Other</label>
                    </div>
                </div>

                <a href="./consequences.html" class="btn">
                    Continue
                </a>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Say No(o) Compass. All rights reserved.</p>
    </footer>
</body>

</html>
