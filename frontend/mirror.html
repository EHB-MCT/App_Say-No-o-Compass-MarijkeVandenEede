<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Say No(o) Compass</title>
    <link rel="stylesheet" href="./css/stylesheet.css">
    <link rel="icon" type="image/png" sizes="16x16" href="./Images/favicon-16x16.png">

</head>

<body>
    <header>
        <h1><img src="./Images/logo NoCompass.png" alt="Say No(o) Compass" height="150px" width="150px">
            Say No(o) Compass</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="mirror">

            <h2>Your Reflection</h2>

            <p>
                Based on your answers, the AI has generated the following reflection.
            </p>


            <label>
                Compass colour
            </label>

            <!-- Future feature:
The compass colour (Green, Yellow or Red) will be generated by the AI
based on the user's answers. This functionality is planned for a future version.-->
            <p>🟢 Green</p>
            <p>🟡 Yellow</p>
            <p>🔴 Red</p>

            <h3>
                Reflection
            </h3>
            <div id="reflection-output" class="ai-reflection">
            </div>

            <label>
                If a friend were in the same situation, what advice would you give them?
            </label>
            <textarea rows="6" placeholder="Write your advice here..."></textarea>



            <button type="button" id="new-reflection-btn" class="btn">
                Start a new reflection
            </button>

            <a href="./index.html" class="btn">
                Back to Home
            </a>


        </section>

    </main>

    <footer>
        <p>&copy; 2026 Say No(o) Compass. All rights reserved.</p>
    </footer>
    <script src="./script/mirror.js"></script>
</body>
