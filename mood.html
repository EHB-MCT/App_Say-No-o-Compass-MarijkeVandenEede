    <main>

    <section class="mood">

        <h2>How do you feel today?</h2>

        <p>
            Take a moment to reflect on how you are feeling right now.
        </p>

        <form>

            <label>
                <input type="radio" name="mood" value="very-bad">
                😞 Very bad
            </label>

            <label>
                <input type="radio" name="mood" value="neutral">
                😐 Neutral
            </label>

            <label>
                <input type="radio" name="mood" value="very-good">
                😄 Very good
            </label>

            <label for="mood-description">
                Would you like to share something?
            </label>

            <textarea
                id="mood-description"
                rows="5"
            ></textarea>

            <a href="reflection.html">
                Continue
            </a>

        </form>

    </section>
